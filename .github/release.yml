changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking Changes
      labels: [breaking-change]
    - title: New Features
      labels: [feature, enhancement]
    - title: Bug Fixes
      labels: [bug, bugfix, fix]
    - title: Improvements
      labels: [improvement, performance, refactor]
    - title: Documentation
      labels: [documentation, docs]
    - title: Maintenance & CI
      labels: [ci, build, chore, dependencies]
    - title: Other Changes
      labels: ['*']
