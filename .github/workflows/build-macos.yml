name: Build Capital Tracker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Resolve and verify dependencies
        run: |
          go mod tidy
          go mod verify
          echo "CAPITAL_GO_MOD_BEGIN"
          cat go.mod
          echo "CAPITAL_GO_MOD_END"
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build single executable
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=0.1.2" -o "dist/CapitalTracker-darwin-${GOARCH}" ./cmd/capital-tracker
          file "dist/CapitalTracker-darwin-${GOARCH}"
          cd dist
          shasum -a 256 "CapitalTracker-darwin-${GOARCH}" > "CapitalTracker-darwin-${GOARCH}.sha256"
      - name: Smoke test actual macOS binary and home page
        run: |
          test_data="$(mktemp -d)"
          ./dist/CapitalTracker-darwin-arm64 --no-browser --data-dir "$test_data" --port 18765 > "$RUNNER_TEMP/capital-tracker.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; rm -rf "$test_data"' EXIT
          ready=0
          for i in {1..40}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18765/api/meta > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/capital-tracker.log"
            exit 1
          fi
          status="$(curl --silent --max-time 5 --output "$RUNNER_TEMP/capital-home.html" --write-out '%{http_code}' http://127.0.0.1:18765/)"
          test "$status" = "200" || { echo "Expected HTTP 200 for /, got $status"; exit 1; }
          grep -q '<html lang="en">' "$RUNNER_TEMP/capital-home.html"
          curl --silent --fail --max-time 5 http://127.0.0.1:18765/js/app.js | grep -q 'import'
      - uses: actions/upload-artifact@v7
        with:
          name: CapitalTracker-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  cross-platform:
    name: ${{ matrix.goos }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            arch: amd64
            extension: ''
          - goos: windows
            arch: amd64
            extension: '.exe'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - run: go mod tidy && go mod verify
      - name: Build executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          EXT: ${{ matrix.extension }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=0.1.2" -o "dist/CapitalTracker-${GOOS}-${GOARCH}${EXT}" ./cmd/capital-tracker
          cd dist
          shasum -a 256 "CapitalTracker-${GOOS}-${GOARCH}${EXT}" > "CapitalTracker-${GOOS}-${GOARCH}${EXT}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: CapitalTracker-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
