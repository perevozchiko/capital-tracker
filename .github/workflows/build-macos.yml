name: Build Capital Tracker

# Builds are intentionally manual-only during development.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform should be built?"
        required: true
        default: macos
        type: choice
        options:
          - macos
          - linux
          - windows
          - all

permissions:
  contents: read

jobs:
  macos:
    name: macOS Apple Silicon (arm64)
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Resolve and verify dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Frontend JavaScript syntax and decimal parser tests
        run: |
          node --check web/js/app.js
          node --check web/js/numbers.js
          node --experimental-default-type=module --test tests/numbers.test.mjs
      - name: Static analysis
        run: go vet ./...
      - name: Build single executable
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/perevozchiko/capital-tracker/internal/buildinfo.Commit=$(git rev-parse --short=8 HEAD)" -o "dist/CapitalTracker-darwin-${GOARCH}" ./cmd/capital-tracker
          file "dist/CapitalTracker-darwin-${GOARCH}"
          cd dist
          shasum -a 256 "CapitalTracker-darwin-${GOARCH}" > "CapitalTracker-darwin-${GOARCH}.sha256"
      - name: Smoke test actual macOS binary and home page
        run: |
          test_data="$(mktemp -d)"
          ./dist/CapitalTracker-darwin-arm64 --no-browser --data-dir "$test_data" --port 18765 > "$RUNNER_TEMP/capital-tracker.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; rm -rf "$test_data"' EXIT
          ready=0
          for i in {1..40}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18765/api/meta > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/capital-tracker.log"
            exit 1
          fi
          status="$(curl --silent --max-time 5 --output "$RUNNER_TEMP/capital-home.html" --write-out '%{http_code}' http://127.0.0.1:18765/)"
          test "$status" = "200" || { echo "Expected HTTP 200 for /, got $status"; exit 1; }
          grep -q '<html lang="en">' "$RUNNER_TEMP/capital-home.html"
          curl --silent --fail --max-time 5 http://127.0.0.1:18765/js/app.js > "$RUNNER_TEMP/capital-app.js"
          grep -q 'import' "$RUNNER_TEMP/capital-app.js"
          ./dist/CapitalTracker-darwin-arm64 backup --data-dir "$test_data" "$test_data/smoke-backup.db"
          test -s "$test_data/smoke-backup.db"
          kill "$app_pid"
          wait "$app_pid" || true
          # The lock file persists but the OS lock must be released on exit.
          ./dist/CapitalTracker-darwin-arm64 --no-browser --data-dir "$test_data" --port 18765 > "$RUNNER_TEMP/capital-restart.log" 2>&1 &
          app_pid=$!
          ready=0
          for i in {1..40}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18765/api/meta > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/capital-restart.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: CapitalTracker-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux (amd64)
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Resolve and verify dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - name: Go tests
        run: go test -count=1 ./...
      - name: JavaScript tests
        run: |
          node --check web/js/app.js
          node --check web/js/numbers.js
          node --experimental-default-type=module --test tests/numbers.test.mjs
      - name: Go vet
        run: go vet ./...
      - name: Build Linux executable
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/perevozchiko/capital-tracker/internal/buildinfo.Commit=$(git rev-parse --short=8 HEAD)" -o dist/CapitalTracker-linux-amd64 ./cmd/capital-tracker
          cd dist
          sha256sum CapitalTracker-linux-amd64 > CapitalTracker-linux-amd64.sha256
      - name: Smoke test actual Linux binary, backup and restart
        run: |
          test_data="$(mktemp -d)"
          ./dist/CapitalTracker-linux-amd64 --no-browser --data-dir "$test_data" --port 18765 > "$RUNNER_TEMP/capital-linux.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true; rm -rf "$test_data"' EXIT
          ready=0
          for i in {1..40}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18765/api/meta > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/capital-linux.log"
            exit 1
          fi
          curl --silent --fail --max-time 5 http://127.0.0.1:18765/ > "$RUNNER_TEMP/capital-linux-home.html"
          grep -q '<html lang="en">' "$RUNNER_TEMP/capital-linux-home.html"
          ./dist/CapitalTracker-linux-amd64 backup --data-dir "$test_data" "$test_data/smoke-backup.db"
          test -s "$test_data/smoke-backup.db"
          kill "$app_pid"
          wait "$app_pid" || true
          ./dist/CapitalTracker-linux-amd64 --no-browser --data-dir "$test_data" --port 18765 > "$RUNNER_TEMP/capital-linux-restart.log" 2>&1 &
          app_pid=$!
          ready=0
          for i in {1..40}; do
            if curl --silent --fail --max-time 2 http://127.0.0.1:18765/api/meta > /dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/capital-linux-restart.log"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: CapitalTracker-linux-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (amd64)
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Resolve and verify dependencies
        run: |
          go mod tidy -diff
          go mod verify
      - name: Go tests
        run: go test -count=1 ./...
      - name: JavaScript tests
        run: |
          node --check web/js/app.js
          node --check web/js/numbers.js
          node --experimental-default-type=module --test tests/numbers.test.mjs
      - name: Go vet
        run: go vet ./...
      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/perevozchiko/capital-tracker/internal/buildinfo.Commit=$(git rev-parse --short=8 HEAD)" -o dist/CapitalTracker-windows-amd64.exe ./cmd/capital-tracker
          cd dist
          sha256sum CapitalTracker-windows-amd64.exe > CapitalTracker-windows-amd64.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: CapitalTracker-windows-amd64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
