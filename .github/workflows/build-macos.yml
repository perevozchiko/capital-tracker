name: Build macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Resolve and verify dependencies
        run: |
          go mod tidy
          go mod verify
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build single-file app
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=0.1.0" -o "dist/CapitalTracker-darwin-${GOARCH}" ./cmd/capital-tracker
          file "dist/CapitalTracker-darwin-${GOARCH}"
          cd dist
          shasum -a 256 "CapitalTracker-darwin-${GOARCH}" > "CapitalTracker-darwin-${GOARCH}.sha256"
      - name: Upload downloadable application
        uses: actions/upload-artifact@v7
        with:
          name: CapitalTracker-macos-${{ matrix.arch }}
          path: |
            dist/CapitalTracker-darwin-${{ matrix.arch }}
            dist/CapitalTracker-darwin-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 30
