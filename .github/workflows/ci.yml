name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes obsolete runs on the same branch or PR.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, JavaScript and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Go, JavaScript, formatting and unit tests
        run: npm run check
      - name: Release version and archive tests
        run: python -m unittest discover -s tests -p '*release*test.py'
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright end-to-end tests
        run: npm run test:ui
      - name: Upload browser traces when tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

  windows-module-smoke:
    name: Windows go.sum checkout and build (temporary PR check)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - name: Verify LF checkout and dependencies
        shell: bash
        run: |
          git check-attr eol -- go.mod go.sum
          if grep -q $'\r' go.mod go.sum; then
            echo 'Go module files contain CRLF'
            exit 1
          fi
          go mod tidy -diff
          go mod verify
      - name: Build Windows app
        shell: bash
        run: |
          go test -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -o CapitalTracker-windows-amd64.exe ./cmd/capital-tracker
