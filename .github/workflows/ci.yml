name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes obsolete runs on the same branch or PR.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, JavaScript and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      # Keep this version aligned with package-lock.json; npm test checks it.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git trust for the container workspace
        timeout-minutes: 1
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install JavaScript dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Go, JavaScript, formatting and unit tests
        run: npm run check
      - name: Known vulnerability checks
        run: npm run security:check
      - name: Release version and archive tests
        run: python -m unittest discover -s tests -p '*release*test.py'
      - name: Verify bundled Chrome and Safari browser engines
        timeout-minutes: 1
        run: node scripts/check-playwright-browsers.mjs
      - name: Playwright end-to-end tests
        timeout-minutes: 25
        run: npm run test:ui
      - name: Upload browser traces when tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore
