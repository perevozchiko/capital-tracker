name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes obsolete runs on the same branch or PR.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, JavaScript and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Capture Prettier output for CSV/Excel change
        run: |
          npx prettier --write web/js/app.js web/js/data-actions.js web/js/tabular-export.js tests/tabular-export.test.mjs
          for file in web/js/app.js web/js/data-actions.js web/js/tabular-export.js tests/tabular-export.test.mjs; do
            echo "BEGIN_FORMAT:$file"
            base64 -w 0 "$file"
            echo ""
            echo "END_FORMAT:$file"
          done
          exit 1  # one-off formatting capture; removed with the formatted files
      - name: Go, JavaScript, formatting and unit tests
        run: npm run check
      - name: Known vulnerability checks
        run: npm run security:check
      - name: Release version and archive tests
        run: python -m unittest discover -s tests -p '*release*test.py'
      - name: Install Chrome and Safari browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright end-to-end tests
        run: npm run test:ui
      - name: Upload browser traces when tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore
