name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes obsolete runs on the same branch or PR.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go, JavaScript and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Go, JavaScript, formatting and unit tests
        run: npm run check
      - name: Known vulnerability checks
        run: npm run security:check
      - name: Release version and archive tests
        run: python -m unittest discover -s tests -p '*release*test.py'
      - name: Install Chrome and Safari browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright end-to-end tests
        run: npm run test:ui
      - name: Upload browser traces when tests fail
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results
          path: test-results/
          if-no-files-found: ignore

  # One-time screenshot refresh: remove this job after the eight PNGs are committed.
  refresh-readme-screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Refresh real dark-theme README screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install screenshot browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture all eight screenshots from isolated demo
        run: python scripts/capture-demo-screenshots.py
      - name: Commit actual PNGs to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "All eight screenshots already match the current app."
            exit 0
          fi
          git commit -m "docs: update all eight real Chromium screenshots"
          git push origin HEAD:refs/heads/master
