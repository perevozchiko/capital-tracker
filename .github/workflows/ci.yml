name: CI (manual build checks)

# CI is opt-in: changing branches or opening a PR does not run tests.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and static checks (no tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          find web -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify formatting
        run: npm run format:check
      - name: Static analysis
        run: go vet ./...
      - name: Compile application
        run: go build ./cmd/capital-tracker
      - name: Known vulnerability checks
        run: npm run security:check
