name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Diagnose test formatting
        run: |
          npx prettier tests/ui/app.spec.cjs --write
          git diff -- tests/ui/app.spec.cjs
      - run: npm run check
      - run: python -m unittest discover -s tests -p '*release*test.py'
