name: Capture demo screenshots

on:
  workflow_dispatch:
  # Temporary PR trigger for refreshing screenshot assets; remove after capture.
  pull_request:
    branches: [master]
    paths:
      - scripts/capture-demo-screenshots.py
      - internal/demo/sample-2025-2026.json
      - .github/workflows/capture-screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real dark screenshots
        run: python scripts/capture-demo-screenshots.py
      - name: Commit updated browser captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard.png docs/screenshots/monthly-balances.png docs/screenshots/accounts.png docs/screenshots/mobile-balances.png
          if git diff --cached --quiet; then
            echo "Images are already up to date."
            exit 0
          fi
          git commit -m "docs: capture real dark-theme application screenshots"
          git push
