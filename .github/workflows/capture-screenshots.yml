name: Capture demo screenshots

on:
  workflow_dispatch:
  # Temporary one-shot request via a PR comment; remove after assets are captured.
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name != 'issue_comment' || (github.event.issue.number == 12 && github.event.comment.body == '/capture-gallery' && github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'docs/refresh-gallery-2026' || github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real dark screenshots
        run: python scripts/capture-demo-screenshots.py
      - name: Commit updated browser captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard.png docs/screenshots/monthly-balances.png docs/screenshots/accounts.png docs/screenshots/mobile-balances.png
          if git diff --cached --quiet; then
            echo "Images are already up to date."
            exit 0
          fi
          git commit -m "docs: capture real dark-theme application screenshots"
          git push
