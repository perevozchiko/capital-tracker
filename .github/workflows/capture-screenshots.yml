name: Capture demo screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture real dark screenshots
        run: python scripts/capture-demo-screenshots.py
      - name: Commit updated browser captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard.png docs/screenshots/monthly-balances.png docs/screenshots/accounts.png docs/screenshots/mobile-balances.png
          if git diff --cached --quiet; then
            echo "Images are already up to date."
            exit 0
          fi
          git commit -m "docs: capture real dark-theme application screenshots"
          git push
