<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101010" />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/login.css" />
    <title>Sign in · Capital Tracker</title>
    <script src="/js/login.js" defer></script>
  </head>
  <body>
    <main class="login-panel" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Capital Tracker</h1>
      <p class="subtitle">Sign in to your finances</p>
      <form id="loginForm" method="post" action="/api/auth/login">
        <label for="loginUsername">Username</label>
        <input
          id="loginUsername"
          name="username"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          maxlength="100"
          required
          autofocus
        />
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <label class="remember-device" for="rememberDevice">
          <input id="rememberDevice" name="remember" type="checkbox" checked />
          <span>Keep me signed in on this device</span>
        </label>
        <div id="twoFactorStep" hidden>
          <label for="loginCode">Authenticator code</label>
          <p id="codeHelp" class="code-help">
            Enter the 6-digit code from Authy or your authenticator app to
            confirm this device.
          </p>
          <input
            id="loginCode"
            name="code"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            aria-describedby="codeHelp"
          />
          <label class="remember-device" for="trustDevice">
            <input
              id="trustDevice"
              name="trustDevice"
              type="checkbox"
              checked
            />
            <span>Trust this device — skip codes for 180 days</span>
          </label>
          <p class="code-help">Uncheck both options on a shared device.</p>
        </div>
        <p id="loginError" role="alert" aria-live="polite"></p>
        <button type="submit">Sign in</button>
      </form>
      <noscript><p>Enable JavaScript to sign in.</p></noscript>
    </main>
  </body>
</html>
